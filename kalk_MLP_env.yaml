name: kalk_MLP
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # --- PyTorch (CUDA 11.8, matches RTX A4500 / CUDA toolkit 11.8) ---
  - pytorch>=2.2
  - torchvision
  - pytorch-cuda=11.8
  # --- Geospatial ---
  - rasterio>=1.3
  - gdal
  - geopandas>=0.14
  - affine
  # --- Data / ML ---
  - numpy>=1.26
  - pandas>=2.0
  - scikit-learn>=1.4
  - joblib
  - xgboost>=2.0          # kept for side-by-side comparison with MLP
  # --- Visualisation ---
  - matplotlib
  - tqdm
  # --- Notebook / dev (optional, remove if not needed) ---
  - ipykernel
  - pip
  - pip:
      - joblib  # ensure latest from pip if conda version lags
